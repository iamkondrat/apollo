<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>ERP Склад Аполло</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; touch-action: manipulation; transition: background 0.3s; }
    
    /* --- СТИЛІ СТАРТОВОГО ЕКРАНУ --- */
    #start-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #121212; z-index: 999999;
      display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box;
      overflow-y: auto;
    }
    .menu-title { font-size: 28px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #fff; margin-top: 20px; }
    .mode-btn { width: 100%; max-width: 400px; padding: 25px; margin-bottom: 15px; font-size: 22px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .mode-btn.sale { background: #27ae60; }
    .mode-btn.sale:active { background: #1e8449; transform: scale(0.98); }
    .mode-btn.income { background: #2980b9; }
    .mode-btn.income:active { background: #1f618d; transform: scale(0.98); }
    .mode-sub { font-size: 14px; font-weight: normal; opacity: 0.9; }
    
    .drafts-container { width: 100%; max-width: 400px; margin-top: 20px; background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; box-sizing: border-box; }
    .drafts-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f39c12; display: flex; justify-content: space-between; align-items: center;}
    .draft-card { background: #2a2a2a; border-left: 4px solid #555; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .draft-card.draft-sale { border-left-color: #27ae60; }
    .draft-card.draft-income { border-left-color: #2980b9; }
    .draft-info { flex: 1; font-size: 14px; color: #ccc; }
    .draft-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .draft-actions { display: flex; gap: 8px; margin-left: 10px; }
    .btn-play { background: #4CAF50; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .btn-trash { background: #d32f2f; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; }
    
    /* --- ОСНОВНІ СТИЛІ КАЛЬКУЛЯТОРА --- */
    .sticky-header { background: #1e1e1e; padding: 10px 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 2px solid #333; transition: background 0.3s; }
    .stats-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .stats-row span { color: #4CAF50; font-size: 18px; }

    .sub-stats { font-size: 13px; color: #ccc; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; max-height: 90px; overflow-y: auto; }
    .sub-stat-row { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; border-left: 3px solid #4CAF50; }
    .sub-stat-row span { color: #fff; font-weight: bold; }
    
    .header-btns { display: flex; gap: 10px; }
    .header-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: background 0.1s; }
    .btn-undo { background: #d32f2f; } .btn-undo:active { background: #b71c1c; }
    .btn-pause { background: #f39c12; } .btn-pause:active { background: #d68910; }
    .btn-menu { background: #1976d2; flex: 1.2; } .btn-menu:active { background: #1565c0; }
    
    #settings-menu { background: #222; padding: 15px; border-bottom: 2px solid #333; display: block; transition: background 0.3s; }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px; background: #333; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; outline: none; appearance: auto; -webkit-appearance: auto; }
    input:focus, select:focus { border-color: #4CAF50; }
    
    .action-btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; transition: background 0.1s; }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .list-btn { background: #f57c00; margin-top: 0; } .list-btn:active { background: #e65100; }
    .export-btn { background: #1976d2; margin-top: 0; flex: 2; } .export-btn:active { background: #1565c0; }
    .reset-btn { background: #555; margin-top: 10px; } .reset-btn:active { background: #444; }
    
    .width-input-area { padding: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; box-sizing: border-box; }
    .width-display { flex: 1; padding: 15px; background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 8px; font-size: 20px; font-weight: bold; outline: none; text-align: center; cursor: default; }
    .width-display::placeholder { color: #888; font-size: 16px; font-weight: normal; }
    .btn-add-board { padding: 15px 25px; background: #4CAF50; color: black; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.1s; }
    .btn-add-board:active { background: #388e3c; transform: translateY(2px); }

    .numpad-container { padding: 15px; box-sizing: border-box; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button.num-btn { background: #333; color: white; border: none; padding: 25px 0; font-size: 28px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #111; }
    button.num-btn:active { background: #4CAF50 !important; color: black !important; transform: translateY(4px); box-shadow: 0 0 0 #111 !important; }
    button.clear-btn { background: #d32f2f; } button.clear-btn:active { background: #b71c1c; }
    button.backspace-btn { background: #555; font-size: 22px; } button.backspace-btn:active { background: #444; }

    #list-modal { display: none; background: #2c2c2c; padding: 15px; border-radius: 8px; margin-top: 15px; max-height: 250px; overflow-y: auto; font-size: 14px; }
    
    #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9999999; display: none; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { border: 6px solid #333; border-top: 6px solid #4CAF50; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loader-text { font-size: 22px; font-weight: bold; color: white; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ================= СТАРТОВИЙ ЕКРАН (МЕНЮ) ================= -->
  <div id="start-menu">
    <div class="menu-title">Система Аполло</div>
    
    <button class="mode-btn sale" onclick="setAppMode('sale')">
      🟢 НОВИЙ ПРОДАЖ
      <span class="mode-sub">(Відвантаження сухої дошки клієнту)</span>
    </button>
    
    <button class="mode-btn income" onclick="setAppMode('income')">
      🔵 НОВИЙ ПРИХІД
      <span class="mode-sub">(Сира дошка від постачальника)</span>
    </button>

    <div class="drafts-container">
      <div class="drafts-header">
        ⏸ Відкладені заміри 
        <button onclick="fetchDrafts()" style="background:none; border:none; color:#f39c12; cursor:pointer; font-size:18px;">🔄</button>
      </div>
      <div id="drafts-list">
        <div style="color: #888; font-size: 14px; text-align: center;">Завантаження...</div>
      </div>
    </div>
  </div>

  <!-- ================= ЛОАДЕР ================= -->
  <div id="loading-overlay">
    <div class="loader-content" id="loader-content">
      <div class="spinner"></div>
      <div id="loader-text">Обробка...</div>
    </div>
  </div>
  
  <!-- ================= КОНТЕЙНЕР КАЛЬКУЛЯТОРА ================= -->
  <div id="main-app" style="display: none;">
  
    <div class="sticky-header" id="main-header">
      <div class="stats-row">
        <div><span id="vol">0.000</span> м³</div>
        <div id="sum-container"><span id="sum">0</span> грн</div>
        <div><span id="count">0</span> шт</div>
      </div>
      <div id="sub-stats" class="sub-stats"></div>
      
      <div class="header-btns">
        <button class="btn-undo" onclick="undo()">↩ Скасувати</button>
        <button class="btn-pause" onclick="pauseAndSaveDraft()">⏸ Відкласти</button>
        <button class="btn-menu" id="menu-toggle-btn" onclick="toggleMenu()">⚙️ Налаштування</button>
      </div>
    </div>

    <div id="settings-menu">
      <div class="inputs">
        <input type="text" id="buyer-name" placeholder="Покупець">
        <input type="tel" id="buyer-phone" placeholder="Номер телефону">
        <select id="wood-type">
          <option value="" disabled selected>Оберіть породу</option>
          <option value="Сосна">Сосна</option>
          <option value="Вільха">Вільха</option>
          <option value="Липа">Липа</option>
          <option value="Дуб">Дуб</option>
          <option value="Ясен">Ясен</option>
          <option value="Бук">Бук</option>
          <option value="Клен">Клен</option>
          <option value="Черешня">Черешня</option>
          <option value="Горіх">Горіх</option>
          <option value="Берест">Берест</option>
        </select>
        <input type="text" inputmode="decimal" id="price" placeholder="Ціна за куб (грн)">
        <input type="text" inputmode="decimal" id="len" placeholder="Довжина (м)">
        <input type="text" inputmode="decimal" id="thick" placeholder="Товщина (мм)">
      </div>
      <div class="btn-row">
        <button class="action-btn list-btn" onclick="toggleList()">📋 Список дошок</button>
        <button class="action-btn export-btn" onclick="sendData()">📥 Надіслати на сервер</button>
      </div>
      <button class="action-btn reset-btn" onclick="resetAll()">🗑 Скинути і вийти в меню</button>
      <div id="list-modal"></div>
    </div>

    <div class="width-input-area">
      <input type="text" id="width-display" class="width-display" placeholder="Ширина (см)" readonly>
      <button id="add-board-btn" class="btn-add-board" onclick="confirmAddBoard()">ОК</button>
    </div>

    <div class="numpad-container">
      <div class="numpad">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn clear-btn" onclick="clearWidthInput()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn backspace-btn" onclick="pressBackspace()">⌫</button>
      </div>
    </div>
    
  </div> 

  <script>
    // === АВТОМАТИЧНО ВСТАВЛЕНЕ ПОСИЛАННЯ ===
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzyTV7cnWGeYD4rX23UaTcnBNQJ5MwOMriJB-aHsQ3K51c69et1rNBsnc63o_8ybeM/exec";
    // =======================================

    let totalVol = 0;
    let history = []; 
    let currentWidthInput = ""; 
    let lastSentCount = 0; 
    let currentMode = 'sale'; 

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playClickSound() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function initApp() {
      const storedHistory = localStorage.getItem('apollo_board_history');
      if (storedHistory && JSON.parse(storedHistory).length > 0) {
        loadStoredData();
      } else {
        document.getElementById('start-menu').style.display = 'flex';
        document.getElementById('main-app').style.display = 'none';
        fetchDrafts();
      }
    }

    function setAppMode(mode) {
      currentMode = mode;
      localStorage.setItem('apollo_mode', currentMode);
      
      document.getElementById('start-menu').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      
      const buyerInput = document.getElementById('buyer-name');
      const phoneInput = document.getElementById('buyer-phone');
      const priceInput = document.getElementById('price');
      const header = document.getElementById('main-header');
      const settings = document.getElementById('settings-menu');

      if (mode === 'income') {
        document.body.style.background = '#0a192f'; 
        header.style.background = '#112240';
        settings.style.background = '#0a192f';
        if (buyerInput) buyerInput.placeholder = "Ім'я постачальника";
        if (phoneInput) phoneInput.style.display = 'none';
        if (priceInput) priceInput.style.display = 'none';
      } else {
        document.body.style.background = '#121212'; 
        header.style.background = '#1e1e1e';
        settings.style.background = '#222';
        if (buyerInput) buyerInput.placeholder = "Ім'я покупця";
        if (phoneInput) phoneInput.style.display = '';
        if (priceInput) priceInput.style.display = '';
      }
      
      settings.style.display = 'block';
      document.getElementById('menu-toggle-btn').innerText = '⚙️ Приховати налаштування';
      updateUI(); 
    }

    let loadedDrafts = []; 

    async function fetchDrafts() {
      const listDiv = document.getElementById('drafts-list');
      listDiv.innerHTML = '<div style="color: #888; text-align: center;">Завантаження списку...</div>';
      
      try {
        const res = await fetch(BACKEND_URL + "?action=loadDrafts");
        const data = await res.json();
        
        if (data.drafts && data.drafts.length > 0) {
          loadedDrafts = data.drafts;
          let html = '';
          data.drafts.forEach(d => {
            const isIncome = (d.mode === 'income');
            const title = isIncome ? 'Прихід' : 'Продаж';
            const color = isIncome ? '#2980b9' : '#27ae60';
            const boards = JSON.parse(d.boardsData);
            
            const timeRaw = new Date(d.date);
            const timeStr = timeRaw.getHours().toString().padStart(2, '0') + ':' + timeRaw.getMinutes().toString().padStart(2, '0');

            html += `
              <div class="draft-card" style="border-left-color: ${color}">
                <div class="draft-info">
                  <div class="draft-title">${title}: ${d.name || 'Без імені'}</div>
                  <div>${boards.length} дошок • збережено о ${timeStr}</div>
                </div>
                <div class="draft-actions">
                  <button class="btn-play" onclick="resumeDraft('${d.id}')">▶️</button>
                  <button class="btn-trash" onclick="deleteDraftUI('${d.id}')">🗑</button>
                </div>
              </div>
            `;
          });
          listDiv.innerHTML = html;
        } else {
          listDiv.innerHTML = '<div style="color: #888; text-align: center;">Немає відкладених замірів</div>';
        }
      } catch(e) {
        listDiv.innerHTML = '<div style="color: #d32f2f; text-align: center;">Помилка завантаження чернеток</div>';
      }
    }

    function resumeDraft(draftId) {
      const draft = loadedDrafts.find(d => d.id === draftId);
      if (!draft) return;
      
      history = JSON.parse(draft.boardsData);
      
      const nameEl = document.getElementById('buyer-name'); if(nameEl) nameEl.value = draft.name || "";
      
      const phoneEl = document.getElementById('buyer-phone'); 
      if(phoneEl) {
        let restoredPhone = (draft.phone || "").toString();
        if (restoredPhone.length === 9) {
          restoredPhone = '0' + restoredPhone;
        }
        phoneEl.value = restoredPhone;
      }
      
      if (history.length > 0) {
        const lastBoard = history[history.length - 1];
        const woodEl = document.getElementById('wood-type'); if(woodEl) woodEl.value = lastBoard.wood || "";
        const priceEl = document.getElementById('price'); if(priceEl && lastBoard.cubePrice) priceEl.value = lastBoard.cubePrice + " грн";
        const lenEl = document.getElementById('len'); if(lenEl && lastBoard.length) lenEl.value = lastBoard.length + " м";
        const thickEl = document.getElementById('thick'); if(thickEl && lastBoard.thick) thickEl.value = lastBoard.thick + " мм";
      }
      
      deleteDraftUI(draftId, true);
      
      setAppMode(draft.mode || 'sale');
      updateUI();
      renderList();
      saveStoredData(); 
    }

    async function deleteDraftUI(draftId, isResuming = false) {
      if (!isResuming && !confirm("Точно видалити цю чернетку з бази?")) return;
      if (!isResuming) {
        const listDiv = document.getElementById('drafts-list');
        listDiv.innerHTML = '<div style="color: #888; text-align: center;">Видалення...</div>';
      }
      
      try {
        await fetch(BACKEND_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'deleteDraft', draftId: draftId })
        });
        if (!isResuming) setTimeout(fetchDrafts, 1000); 
      } catch (err) {
        if (!isResuming) alert("Помилка видалення чернетки");
      }
    }

    async function pauseAndSaveDraft() {
      if (history.length === 0) {
        resetAndGoHome();
        return;
      }
      showLoader("Збереження чернетки...");
      
      const bName = document.getElementById('buyer-name').value || "Без імені";
      const bPhone = document.getElementById('buyer-phone').value || "";
      
      try {
        await fetch(BACKEND_URL, {
          method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ 
            action: 'saveDraft', 
            mode: currentMode,
            buyerName: bName,
            phone: bPhone,
            boardsHistory: history
          })
        });
        hideLoader();
        resetAndGoHome();
      } catch (err) {
        hideLoader();
        alert("Помилка збереження чернетки! Перевірте інтернет.");
      }
    }

    async function resetAll() {
      let msg = "Увага! Ви впевнені, що хочете видалити всі заміри та вийти в Головне меню?";
      
      if (history.length > 0 && history.length !== lastSentCount) {
         msg = "⚠️ У вас є НЕВІДПРАВЛЕНІ дані!\nТочно хочете скасувати їх?\n(Вони збережуться в таблицю з позначкою СКАСОВАНО)";
      }
      
      if (confirm(msg)) {
        if (history.length > 0 && history.length !== lastSentCount) {
          showLoader("Відправка в скасоване...");
          await theoryAutoSend(true, true);
        }
        resetAndGoHome();
        hideLoader();
      }
    }

    function resetAndGoHome() {
      totalVol = 0; history = []; lastSentCount = 0;
      localStorage.clear(); 
      updateUI(); renderList();
      
      document.getElementById('buyer-name').value = ""; 
      document.getElementById('buyer-phone').value = "";
      document.getElementById('wood-type').value = ""; 
      document.getElementById('price').value = ""; 
      document.getElementById('len').value = ""; 
      document.getElementById('thick').value = ""; 
      clearWidthInput();
      
      document.getElementById('start-menu').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
      fetchDrafts();
    }

    function showLoader(text) {
      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('loader-content').innerHTML = `<div class="spinner"></div><div id="loader-text">${text}</div>`;
    }
    function hideLoader() { document.getElementById('loading-overlay').style.display = 'none'; }

    function loadStoredData() {
      const storedMode = localStorage.getItem('apollo_mode');
      if (storedMode) setAppMode(storedMode);

      const storedBuyer = localStorage.getItem('apollo_buyer_name');
      const storedPhone = localStorage.getItem('apollo_buyer_phone');
      const storedWood = localStorage.getItem('apollo_wood_type');
      const storedPrice = localStorage.getItem('apollo_price');
      const storedLen = localStorage.getItem('apollo_len');
      const storedThick = localStorage.getItem('apollo_thick');
      
      const storedHistory = localStorage.getItem('apollo_board_history');
      const storedVol = localStorage.getItem('apollo_total_vol');
      const storedWidth = localStorage.getItem('apollo_current_width'); 
      const storedLastSent = localStorage.getItem('apollo_last_sent'); 
      
      if (storedBuyer) { const el = document.getElementById('buyer-name'); if(el) el.value = storedBuyer; }
      if (storedPhone) { const el = document.getElementById('buyer-phone'); if(el) el.value = storedPhone; }
      if (storedWood) { const el = document.getElementById('wood-type'); if(el) el.value = storedWood; }
      if (storedPrice) { const el = document.getElementById('price'); if(el) el.value = storedPrice; }
      if (storedLen) { const el = document.getElementById('len'); if(el) el.value = storedLen; }
      if (storedThick) { const el = document.getElementById('thick'); if(el) el.value = storedThick; }

      if (storedHistory) history = JSON.parse(storedHistory);
      if (storedVol) totalVol = parseFloat(storedVol);
      if (storedWidth) { currentWidthInput = storedWidth; updateWidthDisplay(); }
      if (storedLastSent) lastSentCount = parseInt(storedLastSent, 10); 

      updateUI(); renderList();
    }
    
    function saveStoredData() {
      const bName = document.getElementById('buyer-name'); if (bName) localStorage.setItem('apollo_buyer_name', bName.value);
      const bPhone = document.getElementById('buyer-phone'); if (bPhone) localStorage.setItem('apollo_buyer_phone', bPhone.value);
      const wType = document.getElementById('wood-type'); if (wType) localStorage.setItem('apollo_wood_type', wType.value);
      const pPrice = document.getElementById('price'); if (pPrice) localStorage.setItem('apollo_price', pPrice.value);
      const pLen = document.getElementById('len'); if (pLen) localStorage.setItem('apollo_len', pLen.value);
      const pThick = document.getElementById('thick'); if (pThick) localStorage.setItem('apollo_thick', pThick.value);
      
      localStorage.setItem('apollo_board_history', JSON.stringify(history));
      localStorage.setItem('apollo_total_vol', totalVol.toString());
      localStorage.setItem('apollo_current_width', currentWidthInput); 
      localStorage.setItem('apollo_last_sent', lastSentCount.toString()); 
    }
    
    document.querySelectorAll('#settings-menu input, #settings-menu select').forEach(el => {
      el.addEventListener('input', saveStoredData);
      el.addEventListener('change', saveStoredData);
    });

    function updateWidthDisplay() { const el = document.getElementById('width-display'); if (el) el.value = currentWidthInput; }
    function pressKey(key) { if (currentWidthInput.length < 2) { currentWidthInput += key; updateWidthDisplay(); saveStoredData(); playClickSound(); } }
    function clearWidthInput() { currentWidthInput = ""; updateWidthDisplay(); saveStoredData(); playClickSound(); }
    function pressBackspace() { currentWidthInput = currentWidthInput.slice(0, -1); updateWidthDisplay(); saveStoredData(); playClickSound(); }

    function toggleMenu() {
      const menu = document.getElementById('settings-menu');
      const btn = document.getElementById('menu-toggle-btn');
      if (menu && btn) {
        if (menu.style.display === 'none') { menu.style.display = 'block'; btn.innerText = '⚙️ Приховати налаштування'; } 
        else { menu.style.display = 'none'; btn.innerText = '⚙️ Налаштування'; }
      }
    }

    function confirmAddBoard() {
      const buyerEl = document.getElementById('buyer-name');
      const buyer = buyerEl ? buyerEl.value : "";
      if (buyer === "") { alert("Будь ласка, вкажіть ім'я!"); if(document.getElementById('settings-menu').style.display === 'none') toggleMenu(); return; }
      if (currentWidthInput === "") { alert("Будь ласка, введіть ширину!"); return; }
      const width = parseInt(currentWidthInput);
      if (isNaN(width) || width < 1 || width > 99) { alert("Будь ласка, введіть правильну ширину (1-99 см)!"); clearWidthInput(); return; }
      addBoardFromWidth(width);
      clearWidthInput();
    }

    function getSafeNumber(id) {
      let el = document.getElementById(id);
      if (!el || !el.value) return 0;
      let val = el.value.replace(/[^\d.,]/g, '').replace(',', '.');
      return parseFloat(val) || 0;
    }

    function addBoardFromWidth(widthCm) {
      const buyerEl = document.getElementById('buyer-name');
      const buyer = buyerEl ? buyerEl.value : "";
      const woodEl = document.getElementById('wood-type');
      const wood = woodEl ? woodEl.value : ""; 
      
      const cubePrice = (currentMode === 'income') ? 0 : getSafeNumber('price');
      const l = getSafeNumber('len');
      const t = getSafeNumber('thick') / 1000;
      const w = widthCm / 100;
      
      if (buyer === "") { alert("Вкажіть ім'я!"); return; }
      if (wood === "") { alert("Оберіть породу дерева!"); return; }
      if (currentMode === 'sale' && cubePrice === 0) { alert("Вкажіть ціну за куб!"); return; }
      if (l === 0 || t === 0) { alert("Вкажіть довжину та товщину дошки!"); return; }
      
      const boardVol = l * t * w;
      const boardPrice = boardVol * cubePrice; 
      
      history.push({ buyer: buyer, wood: wood, width: widthCm, length: l, thick: getSafeNumber('thick'), vol: boardVol, cubePrice: cubePrice, price: boardPrice });
      totalVol += boardVol;
      updateUI(); renderList(); saveStoredData(); playClickSound(); if(navigator.vibrate) navigator.vibrate(40);
    }
    
    function undo() {
      if (history.length === 0) return;
      history.pop(); 
      totalVol = history.reduce((sum, board) => sum + board.vol, 0);
      if (totalVol < 0.001) totalVol = 0;
      updateUI(); renderList(); saveStoredData(); playClickSound();
    }

    function deleteBoard(index) {
      if (confirm("Точно видалити цю дошку зі списку?")) {
        history.splice(index, 1); 
        updateUI(); renderList(); saveStoredData(); 
      }
    }

    function updateUI() {
      totalVol = history.reduce((sum, board) => sum + board.vol, 0);
      totalVol = Math.max(0, totalVol);
      
      const volEl = document.getElementById('vol'); if(volEl) volEl.innerText = totalVol.toFixed(3);
      
      const totalSum = history.reduce((sum, board) => sum + board.price, 0);
      const sumEl = document.getElementById('sum'); 
      if (sumEl) {
        sumEl.innerText = Math.max(0, Math.round(totalSum)).toLocaleString('uk-UA');
        const sumParent = document.getElementById('sum-container');
        if (sumParent) {
            sumParent.style.display = (currentMode === 'income') ? 'none' : 'block';
        }
      }
      
      const countEl = document.getElementById('count'); if(countEl) countEl.innerText = history.length;

      const subStatsContainer = document.getElementById('sub-stats');
      if (!subStatsContainer) return;
      if (history.length === 0) { subStatsContainer.innerHTML = ''; return; }

      const groups = {};
      history.forEach(b => {
        const priceLabel = Math.round(b.cubePrice || 0);
        const key = (currentMode === 'income') ? `${b.wood} ${b.thick} мм` : `${b.wood} ${b.thick} мм (${priceLabel} грн/м³)`;
        
        if (!groups[key]) groups[key] = { vol: 0, sum: 0, count: 0 };
        groups[key].vol += b.vol; groups[key].sum += b.price; groups[key].count++;
      });

      let subHtml = '';
      for (const [name, data] of Object.entries(groups)) {
        const sumHtml = (currentMode === 'income') ? '' : `<div><span>${Math.max(0, Math.round(data.sum)).toLocaleString('uk-UA')}</span> грн</div>`;
        subHtml += `<div class="sub-stat-row"><div>${name}:</div><div><span>${Math.max(0, data.vol).toFixed(3)}</span> м³</div>${sumHtml}<div><span>${data.count}</span> шт</div></div>`;
      }
      subStatsContainer.innerHTML = subHtml;
    }

    function toggleList() { const modal = document.getElementById('list-modal'); if(modal) modal.style.display = modal.style.display === 'block' ? 'none' : 'block'; }
    
    function renderList() {
      const listObj = document.getElementById('list-modal'); 
      if (!listObj) return;
      
      const listHTML = [...history].reverse().map((b, i) => {
        const realIndex = history.length - 1 - i; 
        const priceText = (currentMode === 'income') ? '' : `(${Math.round(b.price)} грн / по ${Math.round(b.cubePrice || 0)} грн за куб)`;
        
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #444; background: rgba(0,0,0,0.2); margin-bottom: 6px; border-radius: 8px;">
            <div style="flex-grow: 1;">
               <div style="font-weight: bold; color: #fff; font-size: 16px;">
                 Дошка ${realIndex + 1} (${b.wood}): ${b.length}м × ${b.thick}мм × ${b.width}см = <b>${b.vol.toFixed(3)} м³</b>
               </div>
               <div style="color: #4CAF50; font-size: 14px; margin-top: 4px;">
                 ${priceText}
               </div>
            </div>
            <button onclick="deleteBoard(${realIndex})" style="background: #d32f2f; color: white; border: none; width: 48px; height: 48px; border-radius: 10px; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); margin-left: 10px;">
              🗑️
            </button>
          </div>
        `;
      }).join('');
      listObj.innerHTML = listHTML;
    }

    async function sendData() {
      try {
        if(history.length === 0) { alert("Список порожній! Спочатку додайте дошки."); return; }
        const buyerEl = document.getElementById('buyer-name');
        const buyer = buyerEl ? buyerEl.value : "";
        if (buyer === "") { alert("Будь ласка, вкажіть ім'я перед надсиланням!"); if(document.getElementById('settings-menu').style.display === 'none') toggleMenu(); return; }

        showLoader("Відправлення на сервер...");
        const success = await theoryAutoSend();

        if (success) {
           document.getElementById('loader-content').innerHTML = '<div style="font-size: 50px; margin-bottom:10px;">✅</div><div id="loader-text" style="color: white; font-size: 22px; font-weight: bold;">Успішно!</div>';
        } else {
           document.getElementById('loader-content').innerHTML = '<div style="font-size: 50px; margin-bottom:10px;">❌</div><div id="loader-text" style="color: #ff5252; font-size: 22px; font-weight: bold;">Помилка мережі! Дані збережено на планшет.</div>';
        }

        setTimeout(() => { downloadCSV(); }, 500);

        setTimeout(() => {
           if (success) resetAndGoHome();
           hideLoader();
        }, 2000); 

      } catch (err) {
        alert("Знайдено помилку: " + err.message);
        hideLoader();
      }
    }

    async function theoryAutoSend(isSilent = false, isTrash = false) {
      if (history.length === 0) return true;
      
      const buyerEl = document.getElementById('buyer-name');
      let buyer = buyerEl ? buyerEl.value : "Невідомий";
      if (buyer === "") buyer = "Невідомий";

      if (isTrash) {
        buyer = "🗑️_СКАСОВАНО_" + buyer;
      }

      const phoneEl = document.getElementById('buyer-phone');
      let phone = phoneEl ? phoneEl.value.trim() : "Не вказано";

      const csvContent = formatCSVData();
      const wood = [...new Set(history.map(b => b.wood))].join(', ') || "Не вказана";

      let calculatedSum = Math.round(history.reduce((sum, board) => sum + board.price, 0));
      let calculatedVol = history.reduce((sum, board) => sum + board.vol, 0).toFixed(3); 

      try {
        await fetch(BACKEND_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
            data: csvContent, 
            woodName: wood, 
            buyerName: buyer,
            phone: phone,
            totalSum: calculatedSum, 
            totalVol: calculatedVol, 
            action: 'syncFileSync',
            mode: currentMode,
            isTrash: isTrash
          })
        });
        
        if (!isTrash) {
          lastSentCount = history.length; 
          saveStoredData();
        }
        return true; 
      } catch (error) {
        return false; 
      }
    }

    function downloadCSV() {
      const buyerEl = document.getElementById('buyer-name');
      const buyer = buyerEl ? buyerEl.value : "Без імені";
      const csvContent = formatCSVData();
      
      const date = new Date().toISOString().slice(0, 10);
      const time = new Date().toTimeString().slice(0, 8).replace(/:/g, '-');
      const buyerSafe = buyer.replace(/\s+/g, '_'); 
      const prefix = currentMode === 'income' ? 'ПРИХІД_' : 'ТОЧКОВКА_';
      const fileName = `${prefix}${date}_${buyerSafe}_${time}.csv`;
      
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", fileName);
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function getSortedHistory() { return [...history].sort((a, b) => { if (a.wood < b.wood) return -1; if (a.wood > b.wood) return 1; return 0; }); }

    function formatCSVData() {
      const buyerEl = document.getElementById('buyer-name');
      const buyer = buyerEl ? buyerEl.value : "Без імені";
      const phoneEl = document.getElementById('buyer-phone');
      let phone = phoneEl ? phoneEl.value.trim() : "Не вказано";
      if(phone === "") phone = "Не вказано"; 
      
      const sortedHistory = getSortedHistory();
      const date = new Date().toISOString().slice(0, 10);
      const time = new Date().toTimeString().slice(0, 8);
      
      const personLabel = (currentMode === 'income') ? "Постачальник" : "Покупець";

      let csvContent = `data:text/csv;charset=utf-8,\uFEFF`;
      csvContent += `Телефон: ${phone},,,,,,\n`;
      csvContent += `${personLabel}: ${buyer},,,,,,\n`;
      csvContent += `Дата: ${date} Час: ${time},,,,,,\n`;
      csvContent += `---,,,,,,\n`; 
      
      let grandVolTotal = 0; let grandSumTotal = 0; let woodCount = 0;
      const groupedData = {};
      sortedHistory.forEach(board => {
        const priceLabel = Math.round(board.cubePrice || 0);
        const groupName = (currentMode === 'income') ? board.wood : `${board.wood} (ціна: ${priceLabel} грн/м3)`;
        
        if (!groupedData[groupName]) groupedData[groupName] = [];
        groupedData[groupName].push(board);
      });
      
      const sortedGroups = Object.keys(groupedData).sort();
      let summaryLines = "";
      
      sortedGroups.forEach(groupName => {
        const boards = groupedData[groupName];
        let woodVolTotal = 0; let woodSumTotal = 0; 
        const pureWoodName = boards[0].wood;
        const groupPrice = Math.round(boards[0].cubePrice || 0).toString();
        
        csvContent += `Порода: ${groupName},,,,,,\n`;
        csvContent += "Номер,Довжина (м),Товщина (мм),Ширина (см),Об'єм (м3),Ціна за куб,Сума\n";
        
        woodCount = 0;
        boards.forEach((b) => {
          woodCount++;
          let volString = parseFloat(b.vol.toFixed(6)); 
          let cubePriceString = Math.round(b.cubePrice || 0).toString(); 
          let roundedBoardPrice = Number(b.price.toFixed(2));
          let priceString = roundedBoardPrice.toFixed(2);
          csvContent += `${woodCount},${b.length},${b.thick},${b.width},${volString},${cubePriceString},${priceString}\n`;
          woodVolTotal += b.vol; woodSumTotal += roundedBoardPrice;
        });
        
        csvContent += `---,,,,,,\n`;
        let woodVolString = woodVolTotal.toFixed(3);
        let woodSumString = Math.round(woodSumTotal).toString();
        summaryLines += `Всього: ${pureWoodName},,,,${woodVolString},${groupPrice},${woodSumString}\n`;
        grandVolTotal += woodVolTotal; grandSumTotal += woodSumTotal;
      });
      
      let grandVolString = grandVolTotal.toFixed(3);
      let grandSumString = Math.round(grandSumTotal).toString(); 
      csvContent += summaryLines;
      csvContent += `---,,,,,,\n`;
      csvContent += `ЗАГАЛОМ:,,,,${grandVolString},,${grandSumString}\n`;
      return csvContent;
    }
    
    function setupFormatting() {
      const fields = [{ id: 'price', unit: 'грн' }, { id: 'len', unit: 'м' }, { id: 'thick', unit: 'мм' }];
      fields.forEach(f => {
        const el = document.getElementById(f.id);
        if(!el) return;
        const applyFormat = () => { let val = el.value.replace(/[^\d.,]/g, '').trim(); if (val !== '') el.value = val + ' ' + f.unit; };
        el.addEventListener('focus', function() { this.value = this.value.replace(/[^\d.,]/g, '').trim(); });
        el.addEventListener('blur', applyFormat); applyFormat();
      });
    }
    
    // Ініціалізація
    setupFormatting();
    initApp();

  </script>
</body>
